<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1660" viewBox="0 0 1400 1660" role="img" aria-labelledby="title desc">
  <title id="title">Схема выбора разрешительных документов в строительстве</title>
  <desc id="desc">Визуальный маршрут: исключения, затем проверка класса, вида работ и аттестации.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ee}.title{font:700 50px Arial,sans-serif;fill:#173f4f}.sub{font:400 25px Arial,sans-serif;fill:#55727c}.label{font:700 18px Arial,sans-serif;letter-spacing:2px}.node{font:700 26px Arial,sans-serif;fill:#173f4f}.body{font:400 22px Arial,sans-serif;fill:#41636f}.small{font:400 18px Arial,sans-serif;fill:#41636f}.yes{font:700 20px Arial,sans-serif;fill:#17724f}.no{font:700 20px Arial,sans-serif;fill:#28718a}.line{stroke:#7eaca2;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:#7eaca2}.card{fill:#fff;stroke:#cbded8;stroke-width:3}.question{fill:#fff;stroke:#9bd8cb;stroke-width:4}.start{fill:#164958}.startText{font:700 29px Arial,sans-serif;fill:#fff}.green{fill:#e7f9ef;stroke:#9edebf;stroke-width:3}.blue{fill:#eef9ff;stroke:#a9d5e7;stroke-width:3}.yellow{fill:#fff9e9;stroke:#ded1a2;stroke-width:3}.mint{fill:#e9faf5;stroke:#8fd7ca;stroke-width:3}.warn{fill:#fff6e9;stroke:#f1c98d;stroke-width:3}
    </style>
  </defs>
  <rect class="bg" width="1400" height="1660" rx="44"/>
  <text x="90" y="110" class="label" fill="#087f76">ОБЩАЯ ИНФОРМАЦИЯ · БЫСТРАЯ СХЕМА</text>
  <text x="90" y="175" class="title">Нужны ли разрешительные документы?</text>
  <text x="90" y="222" class="sub">Сначала определяем вид работ. Документ не обещаем, пока не проверены вводные.</text>

  <rect x="330" y="285" width="740" height="88" rx="22" class="start"/>
  <text x="700" y="341" text-anchor="middle" class="startText">Клиент планирует работы в строительстве</text>
  <path d="M700 373V430" class="line"/><path d="M688 416l12 18 12-18" class="arrow"/>

  <rect x="150" y="452" width="1100" height="142" rx="28" class="question"/>
  <text x="190" y="492" class="label" fill="#087f76">ВОПРОС 1</text>
  <text x="190" y="532" class="node">Это пусконаладка, демонтаж</text>
  <text x="190" y="568" class="node">или снос здания / сооружения?</text>

  <path d="M500 594V663H270V709" class="line"/><path d="M258 694l12 18 12-18" class="arrow"/>
  <path d="M900 594V663H1130V709" class="line"/><path d="M1118 694l12 18 12-18" class="arrow"/>
  <text x="320" y="649" class="yes">ДА</text><text x="1050" y="649" class="no">НЕТ</text>

  <rect x="85" y="725" width="390" height="260" rx="28" class="green"/>
  <text x="125" y="772" class="label" fill="#17724f">МАРШРУТ ЗАВЕРШЁН</text>
  <text x="125" y="823" class="node">Разрешительные</text><text x="125" y="860" class="node">документы не требуются</text>
  <text x="125" y="908" class="small">По материалу плитки:</text><text x="125" y="940" class="small">пусконаладка, демонтаж</text><text x="125" y="970" class="small">и снос.</text>

  <rect x="925" y="725" width="390" height="260" rx="28" class="blue"/>
  <text x="965" y="772" class="label" fill="#28718a">ДВИГАЕМСЯ ДАЛЬШЕ</text>
  <text x="965" y="823" class="node">Определяем вид работ</text><text x="965" y="860" class="node">и класс объекта</text>
  <text x="965" y="908" class="small">Текущий ремонт или крупные</text><text x="965" y="938" class="small">работы: новое строительство,</text><text x="965" y="968" class="small">реконструкция, модернизация,</text><text x="965" y="998" class="small">капремонт.</text>

  <path d="M1120 985V1055H700V1094" class="line"/><path d="M688 1080l12 18 12-18" class="arrow"/>
  <rect x="115" y="1110" width="1170" height="172" rx="28" class="yellow"/>
  <text x="155" y="1153" class="label" fill="#8a6811">ВОПРОС 2</text>
  <text x="155" y="1198" class="node">Крупные работы + объект 1–4 класса</text>
  <text x="155" y="1234" class="node">+ вид работ включён в перечень обязательной аттестации?</text>

  <path d="M420 1282V1340" class="line"/><path d="M408 1326l12 18 12-18" class="arrow"/>
  <path d="M700 1282V1340" class="line"/><path d="M688 1326l12 18 12-18" class="arrow"/>
  <path d="M980 1282V1340" class="line"/><path d="M968 1326l12 18 12-18" class="arrow"/>

  <rect x="70" y="1355" width="430" height="210" rx="28" class="mint"/>
  <text x="110" y="1401" class="label" fill="#087f76">ДА · ВСЕ ТРИ УСЛОВИЯ</text>
  <text x="110" y="1453" class="node">СПК + аттестат</text><text x="110" y="1490" class="node">соответствия</text>
  <text x="110" y="1532" class="small">Аттестат нужен только</text><text x="110" y="1560" class="small">при совпадении всех условий.</text>

  <rect x="535" y="1355" width="330" height="210" rx="28" class="blue"/>
  <text x="575" y="1401" class="label" fill="#28718a">НЕТ</text>
  <text x="575" y="1453" class="node">Проверяем</text><text x="575" y="1490" class="node">маршрут СПК</text>
  <text x="575" y="1532" class="small">5-й класс или работы,</text><text x="575" y="1560" class="small">не подлежащие аттестации.</text>

  <rect x="900" y="1355" width="430" height="210" rx="28" class="warn"/>
  <text x="940" y="1401" class="label" fill="#9a5a12">ДАННЫХ НЕ ХВАТАЕТ</text>
  <text x="940" y="1453" class="node">Не обещаем</text><text x="940" y="1490" class="node">документ</text>
  <text x="940" y="1532" class="small">Уточняем вид работ, объект,</text><text x="940" y="1560" class="small">класс и перечень работ.</text>
</svg>
