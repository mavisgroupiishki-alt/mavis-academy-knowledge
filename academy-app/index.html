<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mavis Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-wrap">
        <div class="brand-mark">M</div>
        <div>
          <div class="brand-title">Mavis Academy</div>
          <div class="brand-subtitle">обучение по отделам</div>
        </div>
      </div>

      <nav class="menu">
        <button class="menu-item active" data-view="dashboard">Главная</button>
        <button class="menu-item" data-view="sales">Продажи</button>
        <button class="menu-item" data-view="expert">Эксперты</button>
        <button class="menu-item" data-view="bitrix">Bitrix24</button>
        <button class="menu-item" data-view="knowledge">База знаний</button>
      </nav>

      <div class="sidebar-box">
        <div class="tiny-label">Формат обучения</div>
        <ul class="tiny-list">
          <li>видеоблок</li>
          <li>теория и регламенты</li>
          <li>разбор кейсов</li>
          <li>мини-тренажёры</li>
          <li>итоговый тест</li>
        </ul>
      </div>

      <div class="sidebar-box sidebar-sync">
        <div class="tiny-label">Источник</div>
        <div id="syncStatus">Проверяю GitHub…</div>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <div class="crumb" id="crumb">Главная</div>
          <h1 id="pageTitle">Корпоративное обучение Mavis</h1>
        </div>
        <div class="top-actions">
          <div class="pill-status">MVP 2.0</div>
        </div>
      </header>

      <section id="content"></section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
